name: wardro_app
description: "Wardro — AI-powered outfit generator and digital wardrobe."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # Local-first storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Photo capture & on-device background removal
  image_picker: ^1.1.2
  local_rembg: ^1.1.3

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
