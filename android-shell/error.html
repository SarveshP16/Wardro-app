<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wardro</title>
    <!-- Shown by the Android app when WARDRO_SERVER_URL can't be loaded.
         config.js is generated by scripts/android-prepare.mjs. -->
    <script src="config.js"></script>
    <style>
      /* Tailor's navy (see app/globals.css) -- the default look. */
      :root {
        --background: #e6eaef;
        --surface: #f6f8fa;
        --outline: #cfd7e0;
        --foreground: #16253b;
        --muted: #5d6b7e;
        --accent: #22395c;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #111925;
          --surface: #182231;
          --outline: #26334a;
          --foreground: #e4e9f0;
          --muted: #8c99ab;
          --accent: #c3d3ea;
          --on-accent: #111925;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      h1 {
        font-stretch: 125%;
        font-weight: 800;
        letter-spacing: -0.01em;
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 8px;
      }
      code {
        font-size: 0.85em;
        word-break: break-all;
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: 6px;
        padding: 1px 6px;
      }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        padding: 12px 28px;
        font: inherit;
        font-weight: 600;
        background: var(--accent);
        color: var(--on-accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Wardro</h1>
      <p>Make sure Tailscale is connected on this phone and the Wardro server is running.</p>
      <p><code id="server"></code></p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      const url = window.WARDRO_SERVER_URL;
      document.getElementById("server").textContent = url || "server URL not configured";
      document.getElementById("retry").addEventListener("click", () => {
        if (url) window.location.replace(url);
      });
    </script>
  </body>
</html>
