<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wardro</title>
    <!-- Shown by the Android app when WARDRO_SERVER_URL can't be loaded.
         config.js is generated by scripts/android-prepare.mjs. -->
    <script src="config.js"></script>
    <style>
      :root {
        --background: #faf6f0;
        --surface: #ffffff;
        --outline: #ece4d8;
        --foreground: #211d1a;
        --muted: #6f665d;
        --accent: #b2532d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1b1917;
          --surface: #242220;
          --outline: #3a362f;
          --foreground: #f5efe6;
          --muted: #a89e92;
          --accent: #d97b52;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 600;
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 8px;
      }
      code {
        font-size: 0.85em;
        word-break: break-all;
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: 6px;
        padding: 1px 6px;
      }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font: inherit;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Wardro</h1>
      <p>Make sure Tailscale is connected on this phone and the Wardro server is running.</p>
      <p><code id="server"></code></p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      const url = window.WARDRO_SERVER_URL;
      document.getElementById("server").textContent = url || "server URL not configured";
      document.getElementById("retry").addEventListener("click", () => {
        if (url) window.location.replace(url);
      });
    </script>
  </body>
</html>
